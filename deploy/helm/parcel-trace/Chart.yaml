apiVersion: v2
name: parcel-trace
description: parcel-trace courier platform - identity, shipments, dispatch, tracking, eta, gateway and the Razor Pages frontend
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - logistics
  - microservices
  - kafka
maintainers:
  - name: Owen Shaw
# dev only, prod uses managed services
dependencies:
  - name: postgresql
    version: 15.5.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: mongodb
    version: 15.6.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: mongodb.enabled
  - name: redis
    version: 19.5.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: kafka
    version: 29.3.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: kafka.enabled
