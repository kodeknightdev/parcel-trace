apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "parcel-trace.serviceAccountName" . }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ include "parcel-trace.name" . }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when workload identity is on" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: {{ .Values.workloadIdentity.enabled }}
