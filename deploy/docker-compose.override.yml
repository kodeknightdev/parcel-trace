# dev only: expose services and datastores on localhost
services:
  postgres:
    ports:
      - "5432:5432"
  mongo:
    ports:
      - "27017:27017"
  redis:
    ports:
      - "6379:6379"
  kafka:
    ports:
      - "9094:9094"
  jaeger:
    ports:
      - "4317:4317"
      - "4318:4318"
  identity:
    ports:
      - "5101:8080"
  shipments:
    ports:
      - "5102:8080"
      - "5112:8081"
  dispatch:
    ports:
      - "5103:8080"
    environment:
      Dispatch__SweepIntervalSeconds: 10
  tracking:
    ports:
      - "5104:8080"
    environment:
      LOG_LEVEL: debug
  eta:
    ports:
      - "5105:8080"
